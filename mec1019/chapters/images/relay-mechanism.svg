<text x="1228" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NC</text>
<text x="1228" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NO</text>
<text x="1228" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM</text>
<text x="914" y="188" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">switch arm</text>
<text x="1070" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#119a45" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM connected to NO: you hear a click</text>
