<text x="340" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">Relay off: pin 13 HIGH</text>
<text x="340" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">coil not energised</text>
<text x="504" y="102" text-anchor="end" font-size="11" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">LED off</text>
<text x="362" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">coil</text>
<text x="362" y="316" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">(electromagnet)</text>
<text x="259" y="128" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">spring</text>
<text x="624" y="135" text-anchor="start" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NC</text>
<text x="624" y="215" text-anchor="start" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NO</text>
<text x="61" y="175" text-anchor="end" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM</text>
<text x="186" y="202" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">switch arm</text>
<text x="340" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#00807F" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM connected to NC</text>
<text x="990" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">Relay on: pin 13 LOW</text>
<text x="990" y="56" text-anchor="middle" font-size="13" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">coil energised (the module is active-LOW)</text>
<text x="1154" y="102" text-anchor="end" font-size="11" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">LED on</text>
<text x="1012" y="300" text-anchor="start" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">coil</text>
<text x="1012" y="316" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">(electromagnet)</text>
<text x="1016" y="238" text-anchor="start" font-size="12" font-weight="400" fill="#2f6fd0" paint-order="stroke" stroke="#ffffff" stroke-width="4">magnetic field</text>
<text x="909" y="128" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">spring</text>
<text x="1274" y="135" text-anchor="start" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NC</text>
<text x="1274" y="215" text-anchor="start" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">NO</text>
<text x="711" y="175" text-anchor="end" font-size="14" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM</text>
<text x="836" y="202" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">switch arm</text>
<text x="990" y="420" text-anchor="middle" font-size="15" font-weight="700" fill="#00807F" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM connected to NO: you hear a click</text>
<text x="40" y="450" font-size="13" fill="#5d6370">Teal shows the connected path. The other contact is open: no current can flow through it.</text>
</svg>