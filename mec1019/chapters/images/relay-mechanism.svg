<text x="254" y="188" text-anchor="start" font-size="12" font-weight="400" fill="#5d6370" paint-order="stroke" stroke="#ffffff" stroke-width="4">switch arm</text>
<text x="410" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM connected to NC</text>
<text x="980" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">Relay on: coil energised</text>
