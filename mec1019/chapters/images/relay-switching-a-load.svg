<text x="326" y="184" font-size="11" font-weight="700" fill="#ffffff">IN1</text>
<rect x="309" y="200" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="326" y="209" font-size="11" font-weight="700" fill="#ffffff">IN2</text>
<rect x="309" y="225" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="326" y="234" font-size="11" font-weight="700" fill="#ffffff">VCC</text>
