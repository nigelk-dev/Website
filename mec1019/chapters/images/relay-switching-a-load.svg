<circle cx="608.0" cy="250.0" r="4" fill="#d4a017" stroke="#00000088" stroke-width="1"/>
<circle cx="994.0" cy="186.0" r="4" fill="#d4a017" stroke="#00000088" stroke-width="1"/>
<path d="M207.0 122.0 L207.0 96.0 L110.0 96.0 L110.0 500.0 L1006.0 500.0 L1006.0 186.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M207.0 122.0 L207.0 96.0 L110.0 96.0 L110.0 500.0 L1006.0 500.0 L1006.0 186.0" fill="none" stroke="#222222" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="207.0" cy="122.0" r="4" fill="#222222" stroke="#00000088" stroke-width="1"/>
<circle cx="1006.0" cy="186.0" r="4" fill="#222222" stroke="#00000088" stroke-width="1"/>
<text x="205" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">9 V battery</text>
<text x="1000" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">lamp (or LED + resistor)</text>
<text x="586" y="72" font-size="13" font-weight="700" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">battery + → COM</text>
<text x="638" y="207" font-size="13" font-weight="700" fill="#d4a017" paint-order="stroke" stroke="#ffffff" stroke-width="4">NO → lamp</text>
<text x="520" y="492" font-size="13" font-weight="700" fill="#222222" paint-order="stroke" stroke="#ffffff" stroke-width="4">lamp → battery −</text>
<text x="40" y="560" font-size="13" fill="#5d6370">When relay 1 is energised, COM connects to NO and the lamp lights; when it is released, COM goes back to NC and the lamp goes out.</text>
<text x="40" y="580" font-size="13" fill="#5d6370">Wire the lamp to NC instead to have it on by default and switched off by the Arduino.</text>
</svg>