<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 460" width="1320" height="460" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Switching a load: battery positive to relay 1 COM, relay 1 NO to a lamp, lamp back to the battery negative</title>
