<text x="470" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Relay 1</text>
<text x="470" y="154" text-anchor="middle" font-size="11" fill="#dbe7fb">SRD-05VDC</text>
<circle cx="382" cy="182" r="5" fill="#e53935"/>
<rect x="600" y="87" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="102" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="102" x2="620" y2="102" stroke="#555" stroke-width="2"/>
<text x="593" y="106" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">NO</text>
<rect x="600" y="121" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="136" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="136" x2="620" y2="136" stroke="#555" stroke-width="2"/>
<text x="593" y="140" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">COM</text>
<rect x="600" y="155" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="170" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="170" x2="620" y2="170" stroke="#555" stroke-width="2"/>
<text x="593" y="174" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">NC</text>
<rect x="395" y="218" width="150" height="110" rx="4" fill="#2f6fd0" stroke="#1d4f9e" stroke-width="2"/>
<text x="470" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Relay 2</text>
<text x="470" y="290" text-anchor="middle" font-size="11" fill="#dbe7fb">SRD-05VDC</text>
<circle cx="382" cy="318" r="5" fill="#e53935"/>
<rect x="600" y="223" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="238" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="238" x2="620" y2="238" stroke="#555" stroke-width="2"/>
<text x="593" y="242" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">NO</text>
<rect x="600" y="257" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="272" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="272" x2="620" y2="272" stroke="#555" stroke-width="2"/>
<text x="593" y="276" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">COM</text>
<rect x="600" y="291" width="30" height="30" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="615" cy="306" r="9" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="610" y1="306" x2="620" y2="306" stroke="#555" stroke-width="2"/>
<text x="593" y="310" text-anchor="end" font-size="11" font-weight="700" fill="#ffffff">NC</text>
<text x="465.0" y="340" text-anchor="middle" font-size="12" fill="#c9d4e6">5 V dual relay module (active-LOW)</text>
<circle cx="900" cy="80" r="22" fill="#fff4c2" stroke="#c9a227" stroke-width="2.5"/>
<path d="M890 86 Q895 70 900 86 Q905 70 910 86" fill="none" stroke="#b07a00" stroke-width="2"/>
<rect x="889" y="100" width="22" height="16" rx="3" fill="#9a9a9a"/>
<rect x="760" y="264" width="110" height="64" rx="6" fill="#222" stroke="#000" stroke-width="2"/>
<rect x="830" y="264" width="40" height="64" rx="6" fill="#c98a2b"/>
<rect x="776" y="250" width="18" height="14" rx="2" fill="#bbb" stroke="#777"/>
<rect x="808" y="252" width="18" height="12" rx="6" fill="#bbb" stroke="#777"/>
<text x="785" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">+</text>
<text x="817" y="288" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">−</text>
<path d="M615.0 136.0 L785.0 136.0 L785.0 250.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M615.0 136.0 L785.0 136.0 L785.0 250.0" fill="none" stroke="#c62828" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="615.0" cy="136.0" r="4" fill="#c62828" stroke="#00000088" stroke-width="1"/>
<circle cx="785.0" cy="250.0" r="4" fill="#c62828" stroke="#00000088" stroke-width="1"/>
<path d="M615.0 102.0 L860.0 102.0 L860.0 150.0 L894.0 150.0 L894.0 116.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M615.0 102.0 L860.0 102.0 L860.0 150.0 L894.0 150.0 L894.0 116.0" fill="none" stroke="#d4a017" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="615.0" cy="102.0" r="4" fill="#d4a017" stroke="#00000088" stroke-width="1"/>
<circle cx="894.0" cy="116.0" r="4" fill="#d4a017" stroke="#00000088" stroke-width="1"/>
<path d="M817.0 252.0 L817.0 200.0 L906.0 200.0 L906.0 116.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M817.0 252.0 L817.0 200.0 L906.0 200.0 L906.0 116.0" fill="none" stroke="#222222" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="817.0" cy="252.0" r="4" fill="#222222" stroke="#00000088" stroke-width="1"/>
<circle cx="906.0" cy="116.0" r="4" fill="#222222" stroke="#00000088" stroke-width="1"/>
<text x="932" y="84" text-anchor="start" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">lamp (or LED + resistor)</text>
<text x="815" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#1d1f24" paint-order="stroke" stroke="#ffffff" stroke-width="4">9 V battery</text>
<text x="645" y="128" font-size="13" font-weight="700" fill="#c62828" paint-order="stroke" stroke="#ffffff" stroke-width="4">COM → battery +</text>
<text x="645" y="94" font-size="13" font-weight="700" fill="#d4a017" paint-order="stroke" stroke="#ffffff" stroke-width="4">NO → lamp</text>
<text x="847" y="194" font-size="13" font-weight="700" fill="#222222" paint-order="stroke" stroke="#ffffff" stroke-width="4">battery − → lamp</text>
<text x="40" y="420" font-size="13" fill="#5d6370">When relay 1 is energised, COM connects to NO and the lamp lights; when it is released, COM goes back to NC and the lamp goes out.</text>
<text x="40" y="440" font-size="13" fill="#5d6370">Wire the lamp to NC instead to have it on by default and switched off by the Arduino.</text>
</svg>