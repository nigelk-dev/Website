<circle cx="574" cy="267" r="8" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="569" y1="267" x2="579" y2="267" stroke="#555" stroke-width="2"/>
<text x="574" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">COM</text>
<rect x="594" y="250" width="28" height="34" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="608" cy="267" r="8" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="603" y1="267" x2="613" y2="267" stroke="#555" stroke-width="2"/>
<text x="608" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NO</text>
<rect x="700" y="300" width="140" height="92" rx="4" fill="#2f6fd0" stroke="#1d4f9e" stroke-width="2"/>
<text x="770" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Relay 2</text>
<text x="770" y="362" text-anchor="middle" font-size="11" fill="#dbe7fb">SRD-05VDC</text>
<circle cx="828" cy="410" r="5" fill="#e53935"/>
<rect x="701" y="250" width="28" height="34" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="715" cy="267" r="8" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="710" y1="267" x2="720" y2="267" stroke="#555" stroke-width="2"/>
<text x="715" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NC</text>
<rect x="735" y="250" width="28" height="34" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="749" cy="267" r="8" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="744" y1="267" x2="754" y2="267" stroke="#555" stroke-width="2"/>
<text x="749" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">COM</text>
<rect x="769" y="250" width="28" height="34" rx="3" fill="#2a7fd6" stroke="#185a9e" stroke-width="1.5"/>
<circle cx="783" cy="267" r="8" fill="#c9ccd2" stroke="#777" stroke-width="1"/>
<line x1="778" y1="267" x2="788" y2="267" stroke="#555" stroke-width="2"/>
<text x="783" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">NO</text>
<rect x="540" y="402" width="34" height="16" rx="2" fill="#111" stroke="#555"/>
<rect x="715" y="402" width="34" height="16" rx="2" fill="#111" stroke="#555"/>
<rect x="479" y="295" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="496" y="304" font-size="11" font-weight="700" fill="#ffffff">GND</text>
<rect x="479" y="320" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="496" y="329" font-size="11" font-weight="700" fill="#ffffff">IN1</text>
<rect x="479" y="345" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="496" y="354" font-size="11" font-weight="700" fill="#ffffff">IN2</text>
<rect x="479" y="370" width="10" height="10" fill="#1b1b1b" stroke="#999" stroke-width="1"/>
<text x="496" y="379" font-size="11" font-weight="700" fill="#ffffff">VCC</text>
<text x="660.0" y="434" text-anchor="middle" font-size="13" fill="#c9d4e6">5 V dual relay module (active-LOW)</text>
<rect x="150" y="134" width="110" height="64" rx="6" fill="#222" stroke="#000" stroke-width="2"/>
<rect x="220" y="134" width="40" height="64" rx="6" fill="#c98a2b"/>
<rect x="166" y="120" width="18" height="14" rx="2" fill="#bbb" stroke="#777"/>
<rect x="198" y="122" width="18" height="12" rx="6" fill="#bbb" stroke="#777"/>
<text x="175" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">+</text>
<text x="207" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">−</text>
<circle cx="1000" cy="150" r="22" fill="#fff4c2" stroke="#c9a227" stroke-width="2.5"/>
<path d="M990 156 Q995 140 1000 156 Q1005 140 1010 156" fill="none" stroke="#b07a00" stroke-width="2"/>
<rect x="989" y="170" width="22" height="16" rx="3" fill="#9a9a9a"/>
<path d="M175.0 120.0 L175.0 80.0 L574.0 80.0 L574.0 250.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M175.0 120.0 L175.0 80.0 L574.0 80.0 L574.0 250.0" fill="none" stroke="#c62828" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="175.0" cy="120.0" r="4" fill="#c62828" stroke="#00000088" stroke-width="1"/>
<circle cx="574.0" cy="250.0" r="4" fill="#c62828" stroke="#00000088" stroke-width="1"/>
<path d="M608.0 250.0 L608.0 215.0 L994.0 215.0 L994.0 186.0" fill="none" stroke="#00000055" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
