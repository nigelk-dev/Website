<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 340" width="1010" height="340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>PWM signal with a 75 % duty cycle: on for 7.5 ms and off for 2.5 ms in every 10 ms period, so the average is 3.75 V</title>
<rect width="1010" height="340" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#56646F"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#16212B"/></marker></defs>
<text x="40" y="34" font-size="18" font-weight="700" fill="#16212B">75 % duty cycle</text>
<line x1="110" y1="110" x2="864" y2="110" stroke="#C8D1D7" stroke-dasharray="4 4"/>
<line x1="110" y1="250" x2="110" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="110" y="274" text-anchor="middle" fill="#56646F">0</text>
<line x1="230" y1="250" x2="230" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="230" y="274" text-anchor="middle" fill="#56646F">5</text>
<line x1="350" y1="250" x2="350" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="350" y="274" text-anchor="middle" fill="#56646F">10</text>
<line x1="470" y1="250" x2="470" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="470" y="274" text-anchor="middle" fill="#56646F">15</text>
<line x1="590" y1="250" x2="590" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="590" y="274" text-anchor="middle" fill="#56646F">20</text>
<line x1="710" y1="250" x2="710" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="710" y="274" text-anchor="middle" fill="#56646F">25</text>
<line x1="830" y1="250" x2="830" y2="256" stroke="#16212B" stroke-width="1.5"/>
<text x="830" y="274" text-anchor="middle" fill="#56646F">30</text>
<line x1="110" y1="250" x2="878" y2="250" stroke="#16212B" stroke-width="1.6" marker-end="url(#ax)"/>
<line x1="110" y1="250" x2="110" y2="70" stroke="#16212B" stroke-width="1.6" marker-end="url(#ax)"/>
<text x="98" y="115" text-anchor="end" fill="#16212B" font-weight="700">5 V</text>
<text x="98" y="255" text-anchor="end" fill="#16212B" font-weight="700">0 V</text>
<text x="880" y="296" text-anchor="end" fill="#56646F">time (ms)</text>
<line x1="110" y1="145.0" x2="864" y2="145.0" stroke="#c98a00" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="890" y="150.0" fill="#c98a00" font-weight="700">average 3.75 V</text>
<path d="M110.0 250.0 L110.0 110.0 L290.0 110.0 L290.0 250.0 L350.0 250.0 L350.0 110.0 L530.0 110.0 L530.0 250.0 L590.0 250.0 L590.0 110.0 L770.0 110.0 L770.0 250.0 L830.0 250.0 L830.0 110.0 L854.0 110.0" fill="none" stroke="#00807F" stroke-width="3.5" stroke-linejoin="miter"/>
<line x1="112" y1="84" x2="288.0" y2="84" stroke="#56646F" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="200.0" y="76" text-anchor="middle" fill="#16212B" font-weight="700">on 7.5 ms</text>
<line x1="292.0" y1="84" x2="348" y2="84" stroke="#56646F" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="320.0" y="76" text-anchor="middle" fill="#16212B" font-weight="700">off 2.5 ms</text>
<line x1="110" y1="78" x2="110" y2="106" stroke="#56646F" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="290.0" y1="78" x2="290.0" y2="106" stroke="#56646F" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="350" y1="78" x2="350" y2="106" stroke="#56646F" stroke-width="1" stroke-dasharray="2 3"/>
<line x1="112" y1="296" x2="348" y2="296" stroke="#56646F" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="350" y1="280" x2="350" y2="302" stroke="#56646F" stroke-width="1" stroke-dasharray="2 3"/>
<text x="230.0" y="318" text-anchor="middle" fill="#16212B" font-weight="700">period 10 ms</text>
</svg>