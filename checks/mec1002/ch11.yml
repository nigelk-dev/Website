# Electrical drives · Chapter 11 · Three-Phase Power
- type: numeric
  q: What is the phase difference between the voltages of a three-phase supply?
  answer: 120
  unit: °
  tol: 0.5

- type: cloze
  q: |
    In a **star** system, $V_l$ = [[√3 ~ 1 ~ 1/√3]] × $V_p$ and $I_l$ = [[1 ~ √3 ~ 1/√3]] × $I_p$.
    In a **delta** system, $V_l$ = [[1 ~ √3 ~ 1/√3]] × $V_p$ and $I_l$ = [[√3 ~ 1 ~ 1/√3]] × $I_p$.
  explain: In star the line voltages lead the phase voltages by 30°; in delta the line currents lag the phase currents by 30°.

- type: numeric
  q: A star-connected supply has a phase (line-to-neutral) voltage of {Vp} V. What is the line-to-line voltage?
  vars:
    Vp: [230, 110, 400, 10]
  answer: sqrt(3) * Vp
  unit: V
  solution: |
    V_l = √3 × V_p = √3 × {Vp} = **{=sqrt(3) * Vp} V** (230 V phase gives the familiar 400 V line supply)

- type: mcq
  q: When does current flow in the **neutral** of a star-connected system?
  options:
    - text: Only when the loads are unbalanced
      correct: true
      why: With a balanced load the three phase currents sum to zero.
    - text: Always, because it is the return path
      why: Balanced phase currents cancel, so the neutral carries nothing.
    - text: Only at start-up
    - text: Never

- type: mcq
  q: Which expression gives the total real power of a **balanced** three-phase load in terms of line quantities?
  options:
    - text: $P = \sqrt{3}\,V_lI_l\cos\varphi$, for both star and delta
      correct: true
    - text: $P = 3\,V_lI_l\cos\varphi$, for star only
      why: The factor of 3 goes with **phase** quantities, $P = 3V_pI_p\cos\varphi$.
    - text: $P = \sqrt{3}\,V_lI_l\cos\varphi$, for delta only
    - text: $P = V_lI_l\cos\varphi$

- type: numeric
  q: A balanced delta load has $Z_\Delta$ = {R} + j{X} Ω per phase. What is the equivalent star impedance?
  vars:
    R: [30, 6, 60, 3]
    X: [15, 3, 30, 3]
  parts:
    - label: "Real part:"
      answer: R / 3
      unit: Ω
    - label: "Imaginary part:"
      answer: X / 3
      unit: Ω
  solution: |
    Z_Y = Z_Δ / 3 = **{=R / 3} + j{=X / 3} Ω** per phase

- type: multi
  q: Which are advantages of three-phase systems over single phase? Select all that apply.
  options:
    - text: More power for the same conductor size
      correct: true
    - text: Constant (non-pulsating) power, so smoother machines
      correct: true
    - text: Self-starting motors
      correct: true
    - text: Single-phase supplies can be taken from a three-phase system
      correct: true
    - text: Only two conductors are needed
      why: Three-phase needs three line conductors (plus a neutral in star).

- type: mcq
  q: Why must the phases of a **delta-connected generator** be connected the right way round?
  options:
    - text: Reversing a phase stops the voltages cancelling round the delta, so a large short-circuit current circulates
      correct: true
      why: Correctly connected, the three phase voltages sum to zero round the loop, so no current circulates at no load.
    - text: Otherwise the motor runs backwards
      why: That is about phase sequence on a motor, not a generator's delta loop.
    - text: Otherwise the line voltage is too low
    - text: It does not matter for a generator

- type: numeric
  q: A balanced three-phase motor takes {I} A from a {V} V (line) supply at a power factor of {pf}. What is its input power?
  vars:
    I: [20, 5, 100, 5]
    V: [400, 380, 690, 10]
    pf: [0.85, 0.7, 0.95, 0.05]
  answer: sqrt(3) * V * I * pf / 1000
  unit: kW
  solution: |
    P = √3 × {V} × {I} × {pf} = **{=sqrt(3) * V * I * pf / 1000} kW**

- type: graph
  q: |
    The three phase voltages of a 50 Hz supply are plotted over one cycle (20 ms), with $V_Y$ lagging $V_R$ by 120°. Move the cursor
    to the time when **$V_Y$ is at its positive peak**.
  x: {min: 0, max: 20, label: "time (ms)"}
  y: {min: -400, max: 400, label: "voltage (V)"}
  curves:
    - {expr: "325 * sind(18 * x)", label: "V_R"}
    - {expr: "325 * sind(18 * x - 120)", label: "V_Y"}
    - {expr: "325 * sind(18 * x + 120)", label: "V_B"}
  answer: {x: 11.67, tol: 0.4, start: 3}
  explain: $V_R$ peaks at 5 ms (90°). $V_Y$ lags by 120°, a third of a cycle (6.67 ms), so it peaks at 11.67 ms.
