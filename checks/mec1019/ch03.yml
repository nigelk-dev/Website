# Introduction to microcontrollers · Chapter 3 · Read input voltage
- type: cloze
  q: |
    The analogue pins have a [[10]]-bit converter, giving 2¹⁰ = [[1024]] levels: 0 V reads as 0 and 5 V reads as [[1023]].
    About 2.5 V reads as [[512|511|513]].

- type: numeric
  q: "`analogRead` returns {r}. What voltage is that? (Use `reading × 5.0 / 1023.0`.)"
  vars:
    r: [512, 0, 1023, 1]
  answer: r * 5 / 1023
  unit: V
  tol: 1
  solution: |
    {r} × 5.0 / 1023.0 = **{=r * 5 / 1023} V**

- type: mcq
  q: In C++, what does `5/1023` evaluate to?
  options:
    - text: "0"
      correct: true
      why: Both are whole numbers, so it's integer division. Write `5.0/1023.0` for the fractional result.
    - text: "0.00489"
    - text: "1"
    - text: An error

- type: numeric
  q: "`analogRead` returns {r}. What does `map(reading, 0, 1023, 0, 255)` give (to the nearest whole number), roughly?"
  vars:
    r: [512, 0, 1023, 1]
  answer: r * 255 / 1023
  tol: 1
  solution: |
    {r} × 255/1023 ≈ **{=r * 255 / 1023}**. (Dividing by 4 gives almost the same: {=r / 4}.)

- type: mcq
  q: Why doesn't the dimmer-switch sketch (Exercise 7.2) need a `delay()`?
  options:
    - text: Without one, the brightness follows the knob immediately
      correct: true
    - text: "`analogWrite` has its own delay built in"
    - text: Delays aren't allowed with analogue pins
    - text: It does need one, or the LED won't light

- type: mcq
  q: A version of Exercise 7.3 used `if (reading < kThreshold)` to switch the blue LED **on**. What's wrong with that?
  options:
    - text: It lights the LED below 2.5 V, but the task asks for it to light above 2.5 V
      correct: true
    - text: "`if` can't compare whole numbers"
    - text: It should use `==`
      why: An exact `==` on a measured voltage would almost never be true.
    - text: Nothing

- type: cloze
  q: Complete the three-band logic (red 0–2 V, green above 2 to 3.5 V, blue above 3.5 V).
  code: |
    int reading = analogRead(kPotPin);
    if (reading [[<=]] kLowMax) {
      setLeds(true, false, false);
    } [[else if]] (reading <= kMidMax) {
      setLeds(false, true, false);
    } [[else]] {
      setLeds(false, false, true);
    }
  explain: The chain runs only the **first** branch whose test is true, so exactly one LED is ever lit, and the second test doesn't need to repeat "above 2 V".

- type: tune
  q: |
    The pot (5 kΩ, across 5 V) feeds the three-band sketch: red for 0–2 V, green above 2 to 3.5 V, blue above 3.5 V.
    Turn the knob so that **only the green LED** is lit.
  controls:
    - {name: R2, label: Wiper position (R2), min: 0, max: 5, step: 0.1, value: 0.5, unit: kΩ}
  readouts:
    - {label: Wiper voltage, expr: "R2", unit: V, min: 0, max: 5}
    - {label: Red, kind: lamp, expr: "R2", between: [-1, 2]}
    - {label: Green, kind: lamp, expr: "R2", between: [2, 3.5]}
    - {label: Blue, kind: lamp, expr: "R2", between: [3.5, 6]}
  target:
    - {readout: 2, on: true}
  explain: With 1 mA through the track, $V_{out} = 1\text{ mA} \times R_2$, so 2.1–3.5 kΩ puts it in the green band.

- type: numeric
  q: |
    A divider with $R_1$ = 22 kΩ and $R_2$ = 10 kΩ feeds A0. The system should switch to the battery when the RES falls below
    {Vs} V. What `analogRead` value should `kSwitchReading` be?
  vars:
    Vs: [8, 5, 15, 0.5]
  answer: Vs * 1000 * 10 / 32 * 1023 / 5000
  unit: ""
  tol: 1
  hint: Scale the RES voltage through the divider ($\times 10/32$) to get the pin voltage, then turn it into a reading ($\times 1023/5$).
  solution: |
    V_pin = {Vs} × 10/32 = {=Vs * 10 / 32} V; reading = {=Vs * 10 / 32} × 1023 / 5 = **{=Vs * 1000 * 10 / 32 * 1023 / 5000|3}**.
    The sketch compares each reading with that whole number: no `float` needed while it runs.

- type: cloze
  q: Complete the line that turns a 2.5 V threshold into an `analogRead` value, using only whole numbers.
  code: |
    const int kThreshold = [[2500L|2500l]] * [[1023]] / [[5000]];   // 2.5 V -> 511
  explain: The voltage is written in millivolts so the sum stays whole. The `L` makes the sum a `long` (2500 × 1023 is too big for an `int`), and multiplying before dividing keeps the precision. The compiler works it out once.

- type: multi
  q: Why is it better to make the decision with whole-number readings than with `float` volts on an Arduino Uno? Select all that apply.
  options:
    - text: Using `float` adds over 1 KB of maths routines to program memory
      correct: true
    - text: Whole-number sums run many times faster on the ATmega328P
      correct: true
    - text: Whole numbers are exact; many decimals can't be stored exactly in a `float`
      correct: true
    - text: "`analogRead` can only be compared with a `float`"
      why: "`analogRead` returns a whole number, so comparing it with a whole-number threshold is natural."

- type: multi
  q: What else must be done for the divider reading to be correct? Select all that apply.
  options:
    - text: Connect the RES negative to the Arduino GND (a shared ground)
      correct: true
    - text: Allow for resistor tolerance; ±5 % resistors give up to ±5 % error
      correct: true
    - text: Use the measured resistor values in `kR1` and `kR2` for better accuracy
      correct: true
    - text: Set the analogue pin with `pinMode(A0, OUTPUT)`
      why: An analogue input must stay an input.

- type: numeric
  q: |
    The divider has $R_1$ = {k} × $R_2$, and the code switches to the battery when the pin voltage falls below {Vp} V.
    What RES voltage does that threshold correspond to?
  vars:
    k: [2.172, 1, 4, 0.001]
    Vp: [2.5, 2, 4, 0.1]
  answer: Vp * (1 + k)
  unit: V
  hint: $V_{RES} = V_{pin} \div \dfrac{R_2}{R_1 + R_2} = V_{pin}\,(1 + R_1/R_2)$
  solution: |
    V_RES = {Vp} × (1 + {k}) = **{=Vp * (1 + k)} V**

- type: graph
  q: |
    With $R_1 = 2.172\,R_2$, the pin voltage is plotted against the RES voltage, and the sketch switches to the battery when the pin
    falls below **2.5 V** (dashed). Move the cursor to the **RES voltage** at which it switches.
  x: {min: 0, max: 16, label: "RES voltage (V)"}
  y: {min: 0, max: 5.5, label: "pin voltage (V)"}
  curves:
    - {expr: "x / 3.172", label: "pin voltage"}
    - {expr: "2.5 + 0 * x", label: "threshold"}
  answer: {x: 7.93, tol: 0.25, start: 13}
  explain: $V_{RES} = 2.5 \times (1 + 2.172) \approx 7.9$ V.

- type: mcq
  q: Why add **hysteresis** (two thresholds, e.g. 2.3 V and 2.7 V)?
  options:
    - text: So the relays don't chatter on and off when the RES voltage hovers around a single threshold
      correct: true
      why: Between the two thresholds the load stays on whichever source it already had.
    - text: To make the system respond faster
    - text: To measure two different sources
    - text: To double the measurement resolution

- type: cloze
  q: Complete the hysteresis version of `loop()`.
  code: |
    int reading = analogRead(kResPin);
    if (reading < [[kToBattery ~ kToRes]]) {
      useBattery();
    } else if (reading > [[kToRes ~ kToBattery]]) {
      useRes();
    }
  explain: There is no final `else`. Inside the dead band, `loop()` does nothing.

- type: mcq
  q: Which everyday device uses the same two-threshold idea?
  options:
    - text: A home heating thermostat
      correct: true
    - text: A light switch
    - text: A doorbell
    - text: A fuse

- type: tune
  q: |
    With hysteresis the sketch switches to the battery below 2.3 V and back to the RES only above 2.7 V. Set the pin voltage to a
    value where the load **stays on whichever source it already had**.
  controls:
    - {name: v, label: Pin voltage, min: 0, max: 5, step: 0.05, value: 3.5, unit: V}
  readouts:
    - {label: Switches to battery, kind: lamp, expr: "v", between: [-1, 2.2999]}
    - {label: Dead band, no change, kind: lamp, expr: "v", between: [2.2999, 2.7]}
    - {label: Switches back to RES, kind: lamp, expr: "v", between: [2.7, 6]}
  target:
    - {readout: 1, on: true}
  explain: Between 2.3 and 2.7 V `loop()` does nothing, so small wobbles in the RES voltage no longer make the relays chatter.

- type: reveal
  q: How would you choose a sensible threshold for switching to the battery?
  answer: |
    Start from the **minimum RES voltage the load needs** to work properly, then scale it through the divider:
    $V_{pin} = V_{RES}\,R_2/(R_1 + R_2)$. Use that as the threshold, ideally with a little hysteresis either side so the relays
    don't chatter.

- type: numeric
  q: What `analogRead` value corresponds to a threshold of {mv} mV at the pin? (Use reading = millivolts × 1023 / 5000, rounded down.)
  vars:
    mv: [2300, 500, 4800, 100]
  answer: floor(mv * 1023 / 5000)
  unit: ""
  tol: 0.3
  solution: |
    {mv} × 1023 / 5000 = **{=floor(mv * 1023 / 5000)}** (whole-number division drops the fraction).
