# Introduction to microcontrollers · Chapter 1 · Voltage measurement
- type: mcq
  q: Why can't the renewable source (RES) be connected straight to an Arduino analogue input?
  options:
    - text: The inputs only accept 0–5 V, and the RES may produce 9 V, 12 V or more, which would damage the board
      correct: true
    - text: The RES is AC
    - text: The Arduino needs at least 20 V to read a voltage
    - text: Analogue inputs can only read currents

- type: numeric
  q: A {Vs} V supply drives two {R} Ω resistors in series. Find the current and the voltage across one resistor.
  vars:
    Vs: [12, 5, 24, 1]
    R: [330, 100, 1000, 10]
  parts:
    - label: "Current:"
      answer: Vs / (2 * R) * 1000
      unit: mA
    - label: "Voltage across one:"
      answer: Vs / 2
      unit: V
  solution: |
    R_T = 2 × {R} = {=2 * R} Ω; I = {Vs} / {=2 * R} = **{=Vs / (2 * R) * 1000} mA**; V₁ = I R₁ = **{=Vs / 2} V** (equal resistors split the voltage equally).

- type: numeric
  q: Two {R} Ω resistors in series are connected across {Vs} V. What voltage appears across the bottom resistor?
  vars:
    Vs: [9, 5, 15, 1]
    R: [220, 100, 1000, 10]
  answer: Vs / 2
  unit: V
  solution: |
    Equal resistors split the voltage equally: {Vs} × {R}/(2 × {R}) = **{=Vs / 2} V**

- type: numeric
  q: A divider with $R_1$ = {R1} Ω (top) and $R_2$ = {R2} Ω (bottom) is fed from {Vs} V. Find the current and $V_{out}$.
  vars:
    R1: [330, 100, 1000, 10]
    R2: [100, 100, 1000, 10]
    Vs: [9, 5, 15, 1]
  parts:
    - label: "Current:"
      answer: Vs / (R1 + R2) * 1000
      unit: mA
    - label: "V_out ="
      answer: Vs * R2 / (R1 + R2)
      unit: V
  solution: |
    I = {Vs} / ({R1} + {R2}) = **{=Vs / (R1 + R2) * 1000} mA**; V_out = I R₂ = **{=Vs * R2 / (R1 + R2)} V**

- type: numeric
  q: A voltage divider has $R_1$ = {R1} Ω and $R_2$ = {R2} Ω across {Vs} V. What is $V_{out}$, measured across $R_2$?
  vars:
    R1: [100, 100, 10000, 100]
    R2: [100, 100, 10000, 100]
    Vs: [12, 5, 24, 1]
  answer: Vs * R2 / (R1 + R2)
  unit: V
  solution: |
    V_out = V_s R₂/(R₁ + R₂) = {Vs} × {R2} / ({R1} + {R2}) = **{=Vs * R2 / (R1 + R2)} V**

- type: mcq
  q: The ratio $R_1/R_2$ fixes $V_{out}$. What does the **absolute size** of the resistors set?
  options:
    - text: The current, and so the power the monitoring circuit wastes
      correct: true
      why: Larger resistors waste less energy, but very large values make the readings noisy; around 10 kΩ for $R_2$ is a good compromise.
    - text: The output voltage
    - text: The Arduino's reference voltage
    - text: Nothing

- type: numeric
  q: |
    The RES can produce up to {Vm} V, and the Arduino must see 5 V at that maximum. With $R_2$ = 10 kΩ, what value of $R_1$ is needed?
  vars:
    Vm: [15.86, 8, 30, 0.01]
  answer: (Vm / 5 - 1) * 10
  unit: kΩ
  hint: Set $5 = V_{max}\,R_2/(R_1 + R_2)$ and rearrange to $R_1 = (V_{max}/5 - 1)\,R_2$.
  solution: |
    R₁ = ({Vm}/5 − 1) × R₂ = {=Vm / 5 - 1|4} × 10 kΩ = **{=(Vm / 5 - 1) * 10} kΩ**. Round **up** to the next standard value so V_out stays just under 5 V.

- type: numeric
  q: Design a divider giving {Vo} V at {I} mA from a {Vs} V battery. Find $R_1$ and $R_2$.
  vars:
    Vs: [12, 9, 24, 1]
    Vo: [6, 1, 8, 1]
    I: [60, 10, 100, 10]
  parts:
    - label: "R₁ ="
      answer: (Vs - Vo) / (I / 1000)
      unit: Ω
    - label: "R₂ ="
      answer: Vo / (I / 1000)
      unit: Ω
  hint: Total resistance $R_T = V_s/I$; $R_2 = V_{out}/I$; $R_1 = R_T - R_2$.
  solution: |
    R_T = {Vs} / {=I / 1000} = {=Vs / (I / 1000)} Ω; R₂ = {Vo} / {=I / 1000} = **{=Vo / (I / 1000)} Ω**; R₁ = R_T − R₂ = **{=(Vs - Vo) / (I / 1000)} Ω**

- type: tune
  q: |
    Design a voltage divider from a **12 V** battery whose output is **6 V (±0.2)** while drawing **about 60 mA (±5)**.
  controls:
    - {name: R1, label: R1 (top), min: 20, max: 400, step: 10, value: 300, unit: Ω}
    - {name: R2, label: R2 (bottom), min: 20, max: 400, step: 10, value: 100, unit: Ω}
  readouts:
    - {label: V_out, expr: "12 * R2 / (R1 + R2)", unit: V, min: 0, max: 12}
    - {label: Current, expr: "12 / (R1 + R2) * 1000", unit: mA, min: 0, max: 150}
  target:
    - {readout: 0, min: 5.8, max: 6.2}
    - {readout: 1, min: 55, max: 65}
  explain: The ratio sets $V_{out}$ (equal resistors halve the voltage); the total, $R_T = 12/0.06 = 200$ Ω, sets the current.

- type: cloze
  q: |
    A potentiometer's two outer pins are the ends of a fixed resistance [[track]], and the middle pin is the [[wiper]], which
    splits the track into $R_1$ and $R_2$. With 5 V across it, the pot is an adjustable voltage [[divider]].

- type: numeric
  q: A {Rt} kΩ pot has 5 V across it, and the wiper gives $R_2$ = {R2} kΩ. Find the current through the track and the wiper voltage.
  vars:
    Rt: [5, 5, 10, 5]
    R2: [2.5, 0, 5, 0.5]
  parts:
    - label: "Current:"
      answer: 5 / Rt
      unit: mA
    - label: "V_out ="
      answer: 5 * R2 / Rt
      unit: V
  solution: |
    I = 5 V / {Rt} kΩ = **{=5 / Rt} mA**; V_out = I × R₂ = {=5 / Rt} mA × {R2} kΩ = **{=5 * R2 / Rt} V**

- type: tune
  q: |
    The RES can reach **15.86 V**. Choose $R_1$ and $R_2$ so the Arduino sees **between 4.5 and 5 V** at that maximum, while the divider
    draws **under 1 mA** (to waste little energy).
  controls:
    - {name: R1, label: R1 (top), min: 1, max: 50, step: 1, value: 10, unit: kΩ}
    - {name: R2, label: R2 (bottom), min: 1, max: 50, step: 1, value: 10, unit: kΩ}
  readouts:
    - {label: Pin voltage at 15.86 V, expr: "15.86 * R2 / (R1 + R2)", unit: V, min: 0, max: 16}
    - {label: Divider current, expr: "15.86 / (R1 + R2)", unit: mA, min: 0, max: 8}
  target:
    - {readout: 0, min: 4.5, max: 5}
    - {readout: 1, max: 1}
  explain: $R_1 = 2.172\,R_2$; for example 22 kΩ and 10 kΩ give 4.96 V at 0.5 mA.

- type: mcq
  q: The project's **voltage scaling** block is a voltage divider, not a voltage regulator such as a 7805. Why?
  options:
    - text: A regulator holds its output at a fixed 5 V whatever the RES does, so the Arduino could no longer tell how big the RES voltage is
      correct: true
    - text: A regulator can't work from a renewable source
    - text: A divider can power the pump, a regulator can't
      why: A divider can't power anything; its output collapses as soon as a load draws current.
    - text: Regulators only work on AC

- type: numeric
  q: |
    A 10 kΩ fixed resistor feeds the top of a {Rt} kΩ trimmer, whose wiper goes to A0. With the trimmer turned **fully up** (wiper at the
    top of its track) and the RES at {Vm} V, what voltage reaches A0?
  vars:
    Rt: [10, 5, 20, 5]
    Vm: [16, 12, 18, 1]
  answer: Vm * Rt / (10 + Rt)
  unit: V
  hint: With the wiper at the top, the whole trimmer is the bottom resistor of the divider and the fixed resistor is the top one.
  solution: |
    V_A0 = {Vm} × {Rt} / (10 + {Rt}) = **{=Vm * Rt / (10 + Rt)} V**. Anything over 5 V is above the Arduino's limit, so set the
    trimmer with a multimeter before connecting the Arduino.

- type: order
  q: Put the steps for setting an adjustable divider safely in order.
  items:
    - Connect the largest voltage the RES can produce (or a bench supply set to it) across the divider
    - Measure the wiper voltage to ground with a multimeter
    - Adjust the trimmer until the wiper reads just under 5 V
    - Connect the wiper to the Arduino

- type: numeric
  q: |
    A measurement divider of {R1} kΩ + {R2} kΩ sits across a {V} V RES all the time. What current does it draw, and how much
    power does it waste?
  vars:
    R1: [22, 1, 47, 1]
    R2: [10, 1, 22, 1]
    V: [16, 9, 18, 1]
  parts:
    - label: "Current:"
      answer: V / (R1 + R2)
      unit: mA
    - label: "Power:"
      answer: V * V / (R1 + R2)
      unit: mW
  hint: "The resistors are in series: $I = V/(R_1 + R_2)$ and $P = VI$."
  solution: |
    I = {V} / ({R1} + {R2}) kΩ = **{=V / (R1 + R2)} mA**; P = {V} × {=V / (R1 + R2)} mA = **{=V * V / (R1 + R2)} mW**.
    Smaller resistors with the same ratio give the same pin voltage but waste far more.

- type: mcq
  q: A white LED ($V_f \approx 3.2$ V) is run from a **3.3 V** supply through a 10 Ω resistor. Why is that a poor design?
  options:
    - text: Only about 0.1 V is left across the resistor, so small differences in $V_f$ between LEDs change the current enormously
      correct: true
    - text: White LEDs can't run below 5 V
      why: It may light, but its current depends on the individual LED's forward voltage.
    - text: The resistor will overheat
      why: At 10 mA, a 10 Ω resistor dissipates only 1 mW.
    - text: The LED will be reverse-biased
