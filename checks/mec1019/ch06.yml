# Introduction to microcontrollers · Chapter 6 · Advanced: the RenewableSwitchOver board
- type: mcq
  q: On the board, which parts form the **voltage regulation** block of the project diagram?
  options:
    - text: R7 (10 kΩ) and the SwitchOverADJ trimmer, with the wiper on A0 and TP1
      correct: true
    - text: Q1 and Q3
      why: They switch the battery in (switching circuitry).
    - text: D1 and D2
      why: They join the two switched supplies (switching circuitry).
    - text: The L298N
      why: That is the pump drive.

- type: order
  q: Put the steps for setting the board's SwitchOverADJ trimmer safely in order.
  items:
    - Connect the largest voltage the RES can produce (or a bench supply set to it) to J3
    - Measure the voltage from TP1 to ground with a multimeter
    - Adjust the trimmer until TP1 reads just under 5 V
    - Plug in and power the Arduino

- type: numeric
  q: |
    With {Vr} V applied to J3, a multimeter reads {Vt} V at TP1. What divider fraction $k$ should go in the code as `kRatio`?
  vars:
    Vr: [12, 9, 16, 0.5]
    Vt: [3.6, 2, 4.8, 0.1]
  answer: Vt / Vr
  unit: ""
  solution: |
    k = V_TP1 / V_RES = {Vt} / {Vr} = **{=Vt / Vr|3}**

- type: cloze
  q: |
    On the RenewableSwitchOver board, Arduino pin [[12]] is **batteryOn** and pin [[13]] is **renewableOn**. Writing
    [[HIGH ~ LOW]] to a pin switches that supply **on**, because the switches are active-[[HIGH ~ LOW]].

- type: mcq
  q: Why does each P-MOSFET (Q3, Q4) need an NPN transistor (Q1, Q2) between its gate and the Arduino pin?
  options:
    - text: The gate must swing between the supply voltage (12–16 V) and about 0 V; a 5 V pin can't pull it high enough to turn the MOSFET off, and must not see 12 V
      correct: true
    - text: The MOSFET gate needs about 1 A to switch
      why: A MOSFET gate draws almost no steady current; the problem is the voltage, not the current.
    - text: The NPN transistor makes the switch active-LOW
      why: The board's switches are active-HIGH.
    - text: The NPN transistor limits the pump current

- type: numeric
  q: |
    batteryOn drives Q1's base through R3 = {R} kΩ. With the pin at 5 V and 0.7 V across the base–emitter junction, what base
    current flows?
  vars:
    R: [2.4, 1, 4.7, 0.1]
  answer: (5 - 0.7) / R
  unit: mA
  solution: |
    I_B = (5 − 0.7) / {R} kΩ = **{=(5 - 0.7) / R} mA**, well within the pin's 20 mA.

- type: multi
  q: What do the diodes D1 and D2 do on the board? Select all that apply.
  options:
    - text: Stop current flowing back from VPump through a switched-off MOSFET's body diode into the lower supply
      correct: true
    - text: Let VPump be fed by whichever switched-in supply is higher
      correct: true
    - text: Make it safe for both supplies to be switched on at the same moment
      correct: true
    - text: Raise the pump voltage by about 0.9 V
      why: They drop about 0.9 V; the pump gets slightly less than the supply.

- type: numeric
  q: |
    The "Battery ON" LED (forward voltage 2 V) is fed from {V} V through R8 = {R} Ω. What current does it draw?
  vars:
    V: [12, 9, 16, 1]
    R: [360, 220, 1000, 10]
  answer: (V - 2) / R * 1000
  unit: mA
  solution: |
    I = ({V} − 2) / {R} = **{=(V - 2) / R * 1000} mA**. Compare it with the LED's rating (often 20 mA).

- type: mcq
  q: The relay code switches the old supply **off before** the new one on. Why can the board's code switch the new supply on **first**?
  options:
    - text: Diodes D1/D2 stop the two supplies feeding each other, so both on for a moment is safe, and the pump never loses power
      correct: true
    - text: MOSFETs switch too fast for it to matter
      why: "Speed doesn't help. With no diodes, two supplies joined even briefly would drive current into each other."
    - text: The battery and RES are always at the same voltage
    - text: The Arduino can't switch two pins at once

- type: mcq
  q: With EnB HIGH and IN4 HIGH, what happens when IN3 is **LOW**?
  options:
    - text: OUT4 is at VPump and OUT3 at ground, so the pump is driven (M1 positive, as in direct drive)
      correct: true
    - text: Both outputs are at VPump, so the pump brakes
      why: That's IN3 HIGH, the same as IN4.
    - text: The outputs are disconnected and the pump coasts
      why: That's EnB LOW.
    - text: The pump runs backwards at full speed

- type: tune
  q: |
    On the board, IN4 is held HIGH and the PWM goes on IN3, so the pump is driven while IN3 is **LOW**. Set the
    `analogWrite` value on IN3 so the pump gets **75 % drive (±1)**.
  controls:
    - {name: v, label: analogWrite value on IN3, min: 0, max: 255, step: 1, value: 128}
  readouts:
    - {label: Pump drive, expr: "(255 - v) / 255 * 100", unit: "%", min: 0, max: 100}
  target:
    - {readout: 0, min: 74, max: 76}
  explain: The drive is the time IN3 spends LOW, so write the inverse, `analogWrite(3, 255 - level)`; 75 % drive is 191, written as 64.

- type: multi
  q: How does the board's code differ from the breadboard sketch? Select all that apply.
  options:
    - text: The supply outputs are active-HIGH instead of active-LOW
      correct: true
    - text: D12 switches the battery and D13 the RES, the other way round from the relay wiring
      correct: true
    - text: The new supply can be switched on before the old one goes off
      correct: true
    - text: The PWM is written to IN3 as `255 - level` instead of to the enable pin
      correct: true
    - text: The RES is read on A1 instead of A0
      why: Both read the RES on A0.
