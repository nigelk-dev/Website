# Introduction to microcontrollers · Chapter 8 · Finished circuit and Arduino code
- type: cloze
  q: |
    In the finished circuit, Arduino pin [[13]] drives IN1, the **battery** relay, and pin [[12]] drives IN2, the **RES** relay.
    The divider's mid-point goes to analogue pin [[A0]].

- type: mcq
  q: In the finished circuit, where does the **NO** output of each relay go?
  options:
    - text: Both NO outputs join the load supply
      correct: true
      why: Only one relay is energised at a time, so the load is fed from one source or the other.
    - text: To the Arduino 5 V pin
    - text: To ground
    - text: To the divider

- type: multi
  q: Which must share the breadboard ground rail? Select all that apply.
  options:
    - text: RES −ve
      correct: true
    - text: Battery −ve
      correct: true
    - text: Arduino GND
      correct: true
    - text: The load's negative side
      correct: true

- type: multi
  q: Which are problems with the presentation's original code? Select all that apply.
  options:
    - text: Each `if` acts on the previous value of `Vin`, then reads a new one
      correct: true
    - text: "`Vin = 3.5` at start-up switches to the battery on the first pass, even though `setup()` chose the RES"
      correct: true
    - text: "`float Vwind = A0;` stores a pin number in a `float`"
      correct: true
    - text: It uses `analogWrite` to read the voltage
      why: It correctly uses `analogRead`.

- type: numeric
  q: |
    The code uses the RES only while the pin voltage is above {t} V. If the divider gives 5 V at the RES maximum, how close to its
    peak must the RES be (as a percentage of the maximum)?
  vars:
    t: [4.8, 2, 4.9, 0.1]
  answer: 100 * t / 5
  unit: "%"
  solution: |
    {t} / 5 = **{=100 * t / 5} %** of the maximum, so with 4.8 V the RES is used only within about 4 % of its peak.
    Choose the threshold from the minimum voltage your load really needs.

- type: reveal
  q: How would you choose a sensible threshold for switching to the battery?
  answer: |
    Start from the **minimum RES voltage the load needs** to work properly, then scale it through the divider:
    $V_{pin} = V_{RES}\,R_2/(R_1 + R_2)$. Use that as the threshold, ideally with a little hysteresis either side so the relays
    don't chatter.
