name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so new files in the MEC1019 repo appear on the site
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out MEC1019 materials
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/MEC1019_Sustainable_Processes
          path: _mec1019

      - name: Copy MEC1019 materials into the site
        run: scripts/fetch-mec1019.sh _mec1019 && rm -rf _mec1019

      # ElectricalPowerNotes is private: reading it needs a token saved as the
      # repository secret NOTES_TOKEN (a fine-grained token with read access to
      # its contents). Without one, the MEC1002 pages are left out of the build.
      - name: Check out MEC1002 notes
        if: env.NOTES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/ElectricalPowerNotes
          token: ${{ secrets.NOTES_TOKEN }}
          path: _mec1002

      - name: Copy MEC1002 notes into the site
        if: hashFiles('_mec1002/**') != ''
        run: scripts/fetch-mec1002.sh _mec1002 && rm -rf _mec1002

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
