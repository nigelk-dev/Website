name: Publish site

on:
  # Rebuild on every push. Only pushes to main are deployed; other branches
  # are built so a broken render shows up before it is merged.
  push:
  workflow_dispatch:
  # A course-notes repository can trigger a rebuild with a repository_dispatch
  # event of type "notes-updated"; the daily run catches anything else.
  repository_dispatch:
    types: [notes-updated]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The knowledge checks (checks/*/*.yml) are read with PyYAML; stop the
      # build if any question is malformed or an answer does not evaluate.
      - name: Check the knowledge-check questions
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          python3 scripts/checks.py

      # The three course repositories are private: reading them needs a token
      # saved as the repository secret NOTES_TOKEN (a fine-grained token with
      # read-only Contents access to all three). Without one, the course pages
      # are built empty rather than failing the whole site.
      - name: Check out MEC1019 materials
        if: env.NOTES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/MEC1019_Sustainable_Processes
          token: ${{ secrets.NOTES_TOKEN }}
          path: _mec1019

      - name: Copy MEC1019 materials into the site
        if: hashFiles('_mec1019/**') != ''
        run: scripts/fetch-mec1019.sh _mec1019 && rm -rf _mec1019

      - name: Check out MEC1002 notes (ElectricalPowerNotes)
        if: env.NOTES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/ElectricalPowerNotes
          token: ${{ secrets.NOTES_TOKEN }}
          path: _mec1002

      - name: Copy MEC1002 notes into the site
        if: hashFiles('_mec1002/**') != ''
        run: scripts/fetch-mec1002.sh _mec1002 && rm -rf _mec1002

      - name: Check out MEC1043/1062 notes (ManufacturingAutomationNotes)
        if: env.NOTES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/ManufacturingAutomationNotes
          token: ${{ secrets.NOTES_TOKEN }}
          path: _mec1043_1062

      - name: Copy MEC1043/1062 notes into the site
        if: hashFiles('_mec1043_1062/**') != ''
        run: scripts/fetch-mec1043-1062.sh _mec1043_1062 && rm -rf _mec1043_1062

      # Count the most used terms in the notes for the home page word cloud.
      # Without the notes (no NOTES_TOKEN) the committed snapshot is kept.
      - name: Build home page word cloud
        run: python3 scripts/wordcloud.py

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
