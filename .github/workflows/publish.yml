name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so new files in the MEC1019 repo appear on the site
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out MEC1019 materials
        uses: actions/checkout@v4
        with:
          repository: nigelk-dev/MEC1019_Sustainable_Processes
          path: _mec1019

      - name: Copy MEC1019 materials into the site
        run: scripts/fetch-mec1019.sh _mec1019 && rm -rf _mec1019

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
